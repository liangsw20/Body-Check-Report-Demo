<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="description" content="面向体检受检者的全身微循环检测结果解读原型" />
    <title>微循 · 全身微循环评估</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23123f3b'/%3E%3Cpath d='M32 13v18m0 0-11 8m11-8 11 8M21 39v12m22-12v12' stroke='%238fe0cf' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
:root {
  --cream: #f7f5ef;
  --paper: #fffdf9;
  --paper-2: #fbf9f3;
  --ink: #183c39;
  --ink-2: #2e504c;
  --muted: #72827d;
  --muted-2: #98a59f;
  --line: #e8e2d6;
  --line-strong: #ddd5c6;
  --teal: #168c7b;
  --teal-2: #23a892;
  --teal-soft: #e4f3ee;
  --teal-pale: #f1faf6;
  --amber: #bd8732;
  --amber-soft: #fbf0dc;
  --coral: #cd6b54;
  --coral-soft: #fbe8e1;
  --forest: #123f3b;
  --forest-deep: #0c312e;
  --shadow-sm: 0 2px 8px rgba(26, 55, 48, 0.04);
  --shadow-md: 0 14px 38px rgba(26, 55, 48, 0.08);
  --shadow-lg: 0 30px 80px rgba(20, 49, 43, 0.16);
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 30px;
  --font-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --font-number: "Bahnschrift", "DIN Alternate", "Segoe UI", "Microsoft YaHei", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--cream);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 8% 2%, rgba(205, 232, 220, 0.5), transparent 28%),
    radial-gradient(circle at 92% 12%, rgba(246, 225, 205, 0.45), transparent 26%),
    radial-gradient(circle at 50% 76%, rgba(211, 235, 226, 0.25), transparent 36%);
}

::selection {
  color: #fff;
  background: var(--teal);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  padding: 0;
  color: inherit;
  background: none;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: block;
}

p,
h1,
h2,
h3,
h4,
ul {
  margin: 0;
}

ul {
  padding: 0;
  list-style: none;
}

button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 3px solid rgba(22, 140, 123, 0.45);
  outline-offset: 3px;
}

.app {
  min-height: 100vh;
}

.page {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 46px 62px;
}

/* ---------- top navigation ---------- */

.reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 140;
  height: 3px;
  background: linear-gradient(90deg, #188e7c, #56c4aa);
  box-shadow: 0 0 12px rgba(35, 168, 146, 0.55);
  transition: width 0.08s linear;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 24px;
  height: 78px;
  padding: 0 46px;
  border-bottom: 1px solid rgba(217, 210, 197, 0.7);
  background: rgba(247, 245, 239, 0.9);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 0 0 auto;
  min-width: 188px;
}

.brand-mark {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: #a9e8d9;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 13px;
  background: var(--forest);
  box-shadow: 0 4px 14px rgba(18, 63, 59, 0.18);
}

.brand-mark svg {
  width: 33px;
  height: 33px;
}

.brand-copy {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.brand-copy strong {
  font-size: 19px;
  font-weight: 650;
  letter-spacing: 1px;
}

.brand-copy small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.16em;
}

.chapter-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  margin-right: auto;
  padding: 4px;
  border: 1px solid rgba(223, 216, 203, 0.75);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.54);
}

.chapter-nav button {
  position: relative;
  padding: 8px 17px;
  color: var(--muted);
  border-radius: 999px;
  font-size: 13.5px;
  white-space: nowrap;
  transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.chapter-nav button:hover {
  color: var(--ink);
}

.chapter-nav button.is-active {
  color: var(--ink);
  background: var(--paper);
  box-shadow: 0 2px 8px rgba(29, 62, 54, 0.06);
}

.chapter-nav button.is-active::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 4px;
  width: 16px;
  height: 2px;
  transform: translateX(-50%);
  border-radius: 99px;
  background: var(--teal);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.header-icon-btn {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255, 253, 249, 0.6);
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.header-icon-btn:hover {
  color: var(--ink);
  background: var(--paper);
  transform: rotate(-16deg);
}

.demo-picker {
  position: relative;
}

.demo-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 13px;
  color: var(--ink-2);
  border: 1px dashed #cfc6b7;
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.62);
  font-size: 13px;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.demo-trigger:hover,
.demo-trigger.is-open {
  border-color: #a99e8b;
  background: var(--paper);
}

.demo-badge {
  padding: 2px 7px;
  color: #8a6a36;
  border-radius: 99px;
  background: #f3e7d5;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
}

.demo-trigger > svg {
  color: var(--muted-2);
}

.demo-menu {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  z-index: 120;
  width: 342px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--paper);
  box-shadow: var(--shadow-lg);
  animation: menuIn 0.18s ease both;
}

.demo-menu-head {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 8px 10px 12px;
}

.demo-menu-head b {
  font-size: 14px;
  font-weight: 650;
}

.demo-menu-head span {
  color: var(--muted);
  font-size: 11.5px;
}

.demo-option {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px;
  text-align: left;
  border-radius: 14px;
  transition: background 0.18s ease;
}

.demo-option:hover,
.demo-option.is-active {
  background: #f5f2e9;
}

.demo-option > svg {
  color: var(--teal);
  margin-left: auto;
}

.demo-avatar {
  display: grid;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  place-items: center;
  color: #fff;
  border-radius: 50%;
  font-size: 15px;
  font-weight: 600;
}

.demo-avatar.good {
  background: linear-gradient(135deg, #43b7a0, #187f70);
}

.demo-avatar.watch {
  background: linear-gradient(135deg, #d8ab64, #a6722b);
}

.demo-avatar.check {
  background: linear-gradient(135deg, #d98872, #ad5844);
}

.demo-option-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.demo-option-copy b {
  display: flex;
  align-items: baseline;
  gap: 7px;
  font-size: 13.5px;
  font-weight: 600;
}

.demo-option-copy b small {
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 400;
}

.demo-option-copy > span {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 10.5px;
}

.demo-option-copy i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.demo-option-copy i.good { background: var(--teal); }
.demo-option-copy i.watch { background: var(--amber); }
.demo-option-copy i.check { background: var(--coral); }

.demo-menu-note {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 7px;
  padding: 9px 10px 3px;
  color: var(--muted-2);
  border-top: 1px solid var(--line);
  font-size: 10px;
}

/* ---------- shared type & controls ---------- */

.section-kicker {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--teal);
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: 0.17em;
  text-transform: uppercase;
}

.section-kicker > i {
  display: block;
  width: 18px;
  height: 1.5px;
  background: currentColor;
}

.section-kicker.is-light {
  color: #8fd9c8;
}

.primary-button,
.secondary-button,
.light-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 49px;
  padding: 0 22px;
  border-radius: 999px;
  font-size: 14.5px;
  font-weight: 550;
  white-space: nowrap;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.primary-button {
  color: #f9fbf7;
  background: var(--forest);
  box-shadow: 0 8px 22px rgba(18, 63, 59, 0.18);
}

.primary-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(18, 63, 59, 0.23);
}

.secondary-button {
  color: var(--ink-2);
  border: 1px solid #d8d0c1;
  background: rgba(255, 253, 249, 0.58);
}

.secondary-button:hover {
  background: var(--paper);
  border-color: #c4baa8;
}

.light-button {
  color: var(--forest);
  background: #f5f0e3;
}

.light-button:hover {
  transform: translateY(-2px);
  background: #fffaf0;
}

.primary-button.is-small {
  min-height: 42px;
  padding: 0 17px;
  font-size: 13px;
}

.text-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--teal);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.text-button svg {
  transition: transform 0.18s ease;
}

.text-button:hover svg {
  transform: translateX(3px);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.status-pill > i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-pill.good {
  color: #147d6c;
  background: #e6f6f0;
}

.status-pill.watch {
  color: #9a691f;
  background: #fbf0dc;
}

.status-pill.check {
  color: #af543f;
  background: #fbe8e1;
}

.status-pill.is-compact {
  padding: 3px 8px;
  font-size: 10.5px;
}

.status-pill.is-compact > i {
  width: 5px;
  height: 5px;
}

/* ---------- hero ---------- */

.hero {
  display: grid;
  grid-template-columns: minmax(0, 0.94fr) minmax(550px, 1.06fr);
  gap: 40px;
  align-items: center;
  min-height: 690px;
  padding: 48px 0 20px;
  scroll-margin-top: 80px;
}

.hero-copy {
  max-width: 640px;
  padding: 8px 0 0;
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 11px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.02em;
}

.hero-eyebrow .eyebrow-date {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.hero-eyebrow > i {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #bbae9a;
}

.overall-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  padding: 7px 12px 7px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}

.overall-chip.good { color: #127564; background: #e4f4ee; }
.overall-chip.watch { color: #94631c; background: #fbf0dc; }
.overall-chip.check { color: #a6513d; background: #fbe8e1; }

.overall-chip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 13%, transparent);
}

.hero h1 {
  margin-top: 17px;
  color: var(--ink);
  font-size: clamp(40px, 4vw, 58px);
  font-weight: 600;
  letter-spacing: -0.05em;
  line-height: 1.16;
}

.hero-name {
  color: var(--teal);
}

.hero-lead {
  max-width: 570px;
  margin-top: 21px;
  color: var(--ink-2);
  font-size: 20px;
  line-height: 1.7;
}

.hero-lead-break {
  display: block;
}

.hero-lead strong {
  color: var(--ink);
  font-weight: 650;
}

.hero-lead .good-text { color: #147c6b; }
.hero-lead .watch-text { color: #9a691f; }
.hero-lead .check-text { color: #b25742; }

.hero-note {
  max-width: 545px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.75;
}

.overall-meter {
  display: flex;
  gap: 5px;
  width: 100%;
  max-width: 420px;
  height: 9px;
  margin-top: 26px;
}

.overall-meter span {
  flex: 1;
  border-radius: 99px;
}

.overall-meter span.good { background: #4abda5; }
.overall-meter span.watch { background: #d8a74c; }
.overall-meter span.check { background: #d47d66; }

.overall-meter-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 11px;
}

.overall-meter-labels span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.overall-meter-labels i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.overall-meter-labels i.good { background: #4abda5; }
.overall-meter-labels i.watch { background: #d8a74c; }
.overall-meter-labels i.check { background: #d47d66; }

.hero-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}

.hero-actions .primary-button {
  min-height: 53px;
  padding: 0 25px;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 24px;
  color: var(--muted-2);
  font-size: 11.5px;
}

.hero-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.hero-map-wrap {
  position: relative;
  padding: 9px;
  border: 1px solid #e4ded1;
  border-radius: 34px;
  background: rgba(255, 253, 249, 0.58);
  box-shadow: 0 24px 70px rgba(38, 74, 64, 0.09);
}

/* ---------- body map ---------- */

.body-map {
  position: relative;
  height: clamp(590px, 63vh, 700px);
  overflow: hidden;
  border: 1px solid rgba(214, 226, 216, 0.8);
  border-radius: 27px;
  background:
    radial-gradient(circle at 50% 44%, rgba(202, 237, 226, 0.58), transparent 39%),
    radial-gradient(circle at 9% 15%, rgba(249, 230, 210, 0.6), transparent 26%),
    linear-gradient(150deg, #fbfaf5 0%, #f4f9f5 53%, #f9f4eb 100%);
}

.map-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(5px);
  pointer-events: none;
}

.map-orb-a {
  top: 9%;
  right: 3%;
  width: 160px;
  height: 160px;
  background: rgba(237, 197, 153, 0.2);
}

.map-orb-b {
  bottom: 7%;
  left: 2%;
  width: 190px;
  height: 190px;
  background: rgba(157, 218, 203, 0.17);
}

.map-topline {
  position: absolute;
  top: 17px;
  left: 21px;
  right: 21px;
  z-index: 8;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.02em;
}

.map-topline > span:first-child,
.map-title {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.map-title {
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 600;
}

.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #3eb79e;
  box-shadow: 0 0 0 4px rgba(62, 183, 158, 0.13);
}

.map-hint {
  color: var(--muted-2);
}

.body-svg {
  position: absolute;
  inset: 35px 0 22px;
  z-index: 2;
  width: 100%;
  height: calc(100% - 57px);
}

.body-figure {
  filter: drop-shadow(0 22px 30px rgba(51, 98, 84, 0.12));
}

.body-shape {
  fill: inherit;
  stroke: inherit;
}

.body-hand {
  fill: inherit;
  stroke: inherit;
}

.body-foot {
  fill: inherit;
  stroke: inherit;
}

.body-highlight {
  pointer-events: none;
}

.vessel-arteries path {
  stroke-width: 2.25;
  stroke-linecap: round;
  opacity: 0.9;
}

.heart-organ {
  filter: drop-shadow(0 6px 10px rgba(188, 94, 73, 0.2));
}

.arterial-system {
  pointer-events: none;
}

.vessel-glow path {
  stroke: #8be4d2;
  stroke-width: 8;
  opacity: 0.14;
}

.arterial-tree path {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.artery-main {
  stroke-width: 3.6;
}

.artery-carotid,
.artery-subclavian {
  stroke-width: 2.5;
}

.artery-arm,
.artery-leg {
  stroke-width: 2.8;
}

.artery-arm-branch,
.artery-leg-branch {
  stroke-width: 1.7;
}

.artery-brain {
  stroke-width: 1.25;
  opacity: 0.92;
}

.artery-hand,
.artery-foot {
  stroke-width: 1.15;
  opacity: 0.9;
}

.vessel-veins path {
  stroke-width: 1.4;
  stroke-dasharray: 3 7;
  opacity: 0.52;
  stroke-linecap: round;
}

.vessel-flow circle {
  fill: #27ad94;
  filter: drop-shadow(0 0 4px rgba(35, 168, 146, 0.9));
}

.body-auras {
  pointer-events: none;
}

.brain-tissue {
  stroke-width: 1;
  stroke-linejoin: round;
}

.brain-tissue path {
  fill: currentColor;
  opacity: 0.18;
  stroke: currentColor;
  stroke-opacity: 0.24;
}

.brain-tissue.good { color: #2aa58e; }
.brain-tissue.watch { color: #d3a04b; }
.brain-tissue.check { color: #d47861; }

.body-aura {
  fill-opacity: 0.06;
  stroke-width: 1.2;
  stroke-dasharray: 3 6;
  transform-box: fill-box;
  transform-origin: center;
  animation: auraBreathe 4.6s ease-in-out infinite;
}

.body-aura.good { fill: #2da58e; stroke: rgba(45, 165, 142, 0.42); }
.body-aura.watch { fill: #d3a04b; stroke: rgba(211, 160, 75, 0.46); animation-delay: 0.5s; }
.body-aura.check { fill: #d47861; stroke: rgba(212, 120, 97, 0.5); animation-delay: 1s; }

.map-pin {
  position: absolute;
  z-index: 9;
  width: 42px;
  height: 42px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
}

.pin-core {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 11px;
  height: 11px;
  transform: translate(-50%, -50%);
  border: 2.5px solid #fffdf9;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(24, 60, 57, 0.08), 0 3px 8px rgba(21, 58, 51, 0.22);
}

.map-pin.good .pin-core { background: #2aa58e; }
.map-pin.watch .pin-core { background: #d3a04b; }
.map-pin.check .pin-core { background: #d47861; }

.pin-halo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border: 1px solid;
  border-radius: 50%;
  animation: pinPulse 3.4s ease-out infinite;
}

.map-pin.good .pin-halo { border-color: rgba(42, 165, 142, 0.45); }
.map-pin.watch .pin-halo { border-color: rgba(211, 160, 75, 0.5); }
.map-pin.check .pin-halo { border-color: rgba(212, 120, 97, 0.5); }

.hotspot-card {
  position: absolute;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 164px;
  min-height: 64px;
  padding: 9px 9px 9px 10px;
  text-align: left;
  border: 1px solid rgba(223, 218, 205, 0.85);
  border-left: 3px solid var(--accent);
  border-radius: 15px;
  background: rgba(255, 253, 249, 0.93);
  box-shadow: 0 9px 25px rgba(30, 65, 56, 0.1);
  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.hotspot-card:hover {
  transform: translateY(-3px);
  background: #fffefa;
  box-shadow: 0 13px 30px rgba(30, 65, 56, 0.15);
}

.hotspot-card.good { --accent: #2aa58e; }
.hotspot-card.watch { --accent: #d3a04b; }
.hotspot-card.check { --accent: #d47861; }

.hotspot-icon {
  display: grid;
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  place-items: center;
  color: var(--accent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 11%, white);
}

.hotspot-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 1px;
}

.hotspot-label {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.3;
}

.hotspot-label em {
  padding: 1px 4px;
  color: var(--accent);
  border-radius: 4px;
  background: color-mix(in srgb, var(--accent) 9%, white);
  font-size: 8px;
  font-style: normal;
  font-weight: 600;
  white-space: nowrap;
}

.hotspot-copy strong {
  overflow: hidden;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hotspot-arrow {
  flex: 0 0 auto;
  margin-left: auto;
  color: #b4aea1;
}

.map-legend {
  position: absolute;
  bottom: 16px;
  left: 18px;
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 6px 12px;
  color: var(--muted);
  border: 1px solid rgba(224, 218, 207, 0.8);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.78);
  font-size: 9.5px;
  white-space: nowrap;
  backdrop-filter: blur(8px);
}

.map-legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.legend-dot.good { background: #2aa58e; }
.legend-dot.watch { background: #d3a04b; }
.legend-dot.check { background: #d47861; }

.map-mobile-areas {
  display: none;
}

.map-caption {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px 2px;
  color: var(--muted-2);
  font-size: 10px;
}

.map-caption span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

/* ---------- good news ---------- */

.good-news-band {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 25px;
  padding: 17px 22px;
  border: 1px solid #dcebe2;
  border-radius: 21px;
  background:
    radial-gradient(circle at 91% 18%, rgba(204, 236, 226, 0.38), transparent 25%),
    rgba(255, 253, 249, 0.76);
}

.good-news-icon {
  display: grid;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  place-items: center;
  color: #137c6a;
  border-radius: 50%;
  background: #e2f4ed;
}

.good-news-copy {
  min-width: 0;
  flex: 1;
}

.good-news-copy > span {
  color: #147d6c;
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.08em;
}

.good-news-copy p {
  margin-top: 2px;
  color: var(--ink-2);
  font-size: 14px;
}

/* ---------- explainer ---------- */

.micro-explain {
  display: grid;
  grid-template-columns: minmax(0, 0.98fr) minmax(0, 1.02fr);
  gap: clamp(38px, 6vw, 84px);
  align-items: center;
  margin-top: 96px;
  padding: 20px 0 6px;
}

.explain-copy h2 {
  margin-top: 17px;
  color: var(--ink);
  font-size: clamp(34px, 3.4vw, 48px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.28;
}

.explain-copy h2 em {
  color: var(--teal);
  font-style: normal;
}

.explain-lead {
  max-width: 540px;
  margin-top: 20px;
  color: var(--muted);
  font-size: 15.5px;
  line-height: 1.9;
}

.explain-points {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 31px;
}

.explain-points > div {
  padding-top: 13px;
  border-top: 1px solid #ded8ca;
}

.explain-points span {
  display: block;
  color: var(--teal);
  font-family: var(--font-number);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.explain-points b {
  display: block;
  margin-top: 6px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 650;
}

.explain-points small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}

.explain-note {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-top: 25px;
  color: var(--muted-2);
  font-size: 11.5px;
  line-height: 1.65;
}

.explain-note svg {
  flex: 0 0 auto;
  margin-top: 2px;
}

.capillary-art {
  position: relative;
  overflow: hidden;
  min-height: 470px;
  padding: 45px 20px 18px;
  border: 1px solid #dce9e1;
  border-radius: 31px;
  background:
    radial-gradient(circle at 19% 16%, rgba(255, 255, 255, 0.9), transparent 31%),
    linear-gradient(150deg, #f0f9f4, #f8f4eb);
}

.art-chip {
  position: absolute;
  top: 21px;
  left: 23px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  color: var(--ink-2);
  border: 1px solid rgba(223, 219, 207, 0.9);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.86);
  font-size: 10.5px;
  backdrop-filter: blur(8px);
}

.art-chip span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--coral);
  box-shadow: 0 0 0 4px rgba(205, 107, 84, 0.11);
}

.capillary-art-svg {
  width: 100%;
  height: auto;
}

.capillary-art-svg .art-labels text {
  fill: #4f6763;
  font-size: 12px;
  font-weight: 550;
}

.art-cells circle {
  filter: drop-shadow(0 5px 10px rgba(66, 113, 99, 0.08));
}

.art-caption {
  position: relative;
  z-index: 2;
  max-width: 380px;
  margin: -10px auto 0;
  color: var(--muted);
  font-size: 11.5px;
  text-align: center;
}

/* ---------- areas ---------- */

.areas-section {
  margin-top: 100px;
  scroll-margin-top: 94px;
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 23px;
}

.section-heading h2 {
  margin-top: 14px;
  color: var(--ink);
  font-size: clamp(34px, 3.2vw, 45px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.25;
}

.section-heading p {
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.section-count {
  margin-bottom: 7px;
  padding: 7px 12px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.52);
  font-size: 11px;
  white-space: nowrap;
}

.area-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.area-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 360px;
  padding: 23px 24px 21px;
  overflow: hidden;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 25px;
  background:
    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 35%),
    var(--paper);
  box-shadow: var(--shadow-sm);
  transition: transform 0.23s ease, box-shadow 0.23s ease, border-color 0.23s ease;
}

.area-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 24px;
  width: 60px;
  height: 3px;
  border-radius: 0 0 99px 99px;
  background: var(--accent);
}

.area-card.good { --accent: #2aa58e; }
.area-card.watch { --accent: #d3a04b; }
.area-card.check { --accent: #d47861; }

.area-card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
  box-shadow: 0 20px 45px rgba(30, 65, 56, 0.09);
}

.area-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.area-index {
  color: var(--muted-2);
  font-family: var(--font-number);
  font-size: 11px;
  letter-spacing: 0.12em;
}

.area-card-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 19px;
}

.area-icon {
  display: grid;
  width: 45px;
  height: 45px;
  flex: 0 0 auto;
  place-items: center;
  color: var(--accent);
  border-radius: 14px;
  background: color-mix(in srgb, var(--accent) 10%, white);
}

.area-card-title strong {
  display: block;
  color: var(--ink);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.area-card-title small {
  display: block;
  margin-top: 1px;
  color: var(--muted-2);
  font-size: 10.5px;
}

.area-card-headline {
  display: block;
  margin-top: 22px;
  color: var(--ink-2);
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.35;
}

.area-card-metric {
  display: flex;
  align-items: baseline;
  gap: 5px;
  margin-top: 5px;
  color: var(--accent);
}

.area-card-metric b {
  font-family: var(--font-number);
  font-size: 38px;
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1.2;
}

.area-card-metric em {
  font-family: var(--font-number);
  font-size: 12px;
  font-style: normal;
  opacity: 0.75;
}

.area-card-metric small {
  margin-left: 4px;
  color: var(--muted);
  font-size: 10.5px;
}

.area-card-summary {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.72;
}

.area-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 18px;
  color: var(--ink-2);
  border-top: 1px solid #eee9df;
  font-size: 12px;
  font-weight: 600;
}

.area-card-foot > span {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  color: var(--accent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 9%, white);
  transition: transform 0.2s ease;
}

.area-card:hover .area-card-foot > span {
  transform: translateX(3px);
}

/* ---------- action ---------- */

.action-section {
  position: relative;
  display: grid;
  grid-template-columns: minmax(250px, 0.72fr) minmax(0, 1.55fr);
  gap: 42px;
  margin-top: 100px;
  padding: 43px 45px 31px;
  overflow: hidden;
  color: #f4f4e9;
  border-radius: 32px;
  background:
    radial-gradient(circle at 4% 12%, rgba(61, 136, 119, 0.38), transparent 31%),
    radial-gradient(circle at 92% 103%, rgba(200, 150, 91, 0.13), transparent 30%),
    linear-gradient(140deg, #143f3b, #0b302d);
  box-shadow: 0 28px 70px rgba(15, 48, 44, 0.17);
  scroll-margin-top: 94px;
}

.action-section::after {
  content: "";
  position: absolute;
  top: -100px;
  right: 26%;
  width: 320px;
  height: 320px;
  border: 1px solid rgba(176, 224, 209, 0.08);
  border-radius: 50%;
  pointer-events: none;
}

.action-intro {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  padding-top: 2px;
}

.action-intro h2 {
  margin-top: 17px;
  color: #fcfbf3;
  font-size: clamp(33px, 3.1vw, 44px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.24;
}

.action-intro > p {
  max-width: 265px;
  margin-top: 14px;
  color: rgba(234, 242, 235, 0.62);
  font-size: 12.5px;
  line-height: 1.8;
}

.action-progress {
  width: 100%;
  max-width: 264px;
  margin-top: 25px;
}

.action-progress > div:first-child {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  color: rgba(235, 242, 235, 0.62);
  font-size: 10.5px;
}

.action-progress b {
  color: #a7e6d6;
  font-family: var(--font-number);
  font-size: 13px;
  font-weight: 500;
}

.action-progress-track {
  height: 5px;
  margin-top: 6px;
  overflow: hidden;
  border-radius: 99px;
  background: rgba(228, 245, 237, 0.13);
}

.action-progress-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #78d6c0, #c6eadc);
  transition: width 0.3s ease;
}

.action-intro .light-button {
  margin-top: 28px;
  min-height: 43px;
  padding: 0 17px;
  font-size: 12px;
}

.action-groups {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.action-group {
  padding: 15px 17px 12px;
  border: 1px solid rgba(221, 241, 231, 0.12);
  border-radius: 19px;
  background: rgba(242, 248, 240, 0.055);
}

.action-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  color: #d8eee5;
  font-size: 13px;
  font-weight: 600;
}

.action-group-icon {
  display: grid;
  width: 29px;
  height: 29px;
  place-items: center;
  color: #91dbc7;
  border-radius: 9px;
  background: rgba(132, 216, 195, 0.1);
}

.action-list {
  display: flex;
  flex-direction: column;
}

.action-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 7px 0;
  color: rgba(247, 248, 239, 0.83);
  text-align: left;
  border-bottom: 1px solid rgba(223, 242, 231, 0.08);
  font-size: 12px;
  line-height: 1.6;
  transition: color 0.18s ease, opacity 0.18s ease;
}

.action-item:last-child {
  border-bottom: 0;
}

.action-item:hover {
  color: #fffdf6;
}

.action-check {
  display: grid;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  margin-top: 1px;
  place-items: center;
  color: #0c342f;
  border: 1px solid rgba(196, 236, 222, 0.33);
  border-radius: 50%;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.action-item.is-done {
  color: rgba(235, 243, 236, 0.4);
  text-decoration: line-through;
  text-decoration-color: rgba(235, 243, 236, 0.28);
}

.action-item.is-done .action-check {
  border-color: #8ad7c2;
  background: #8ad7c2;
}

.action-warning {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  grid-column: 1 / -1;
  padding-top: 1px;
  color: rgba(237, 241, 232, 0.46);
  font-size: 10.5px;
  line-height: 1.7;
}

.action-warning svg {
  flex: 0 0 auto;
  margin-top: 2px;
  color: #d6b174;
}

/* ---------- report teaser ---------- */

.report-teaser {
  display: grid;
  grid-template-columns: minmax(270px, 0.7fr) minmax(0, 1.3fr);
  gap: clamp(38px, 6vw, 84px);
  align-items: center;
  margin-top: 100px;
  padding: 45px 52px;
  border: 1px solid var(--line);
  border-radius: 32px;
  background:
    radial-gradient(circle at 10% 12%, rgba(238, 219, 190, 0.42), transparent 34%),
    var(--paper);
  box-shadow: var(--shadow-sm);
}

.report-mini {
  position: relative;
  width: min(300px, 100%);
  min-height: 385px;
  margin: 0 auto;
  padding: 23px 22px 18px;
  transform: rotate(-2.5deg);
  border: 1px solid #e4dccd;
  border-radius: 7px;
  background: #fffefb;
  box-shadow: 0 20px 45px rgba(46, 72, 62, 0.14);
}

.report-mini::after {
  content: "";
  position: absolute;
  top: 8px;
  right: 13px;
  width: 33px;
  height: 33px;
  border: 1px solid #d5c8b5;
  border-radius: 50%;
  opacity: 0.7;
}

.report-mini-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid #eee8dc;
}

.mini-brand {
  color: var(--forest);
  font-size: 16px;
  font-weight: 650;
  letter-spacing: 0.08em;
}

.report-mini-head i {
  width: 44px;
  height: 4px;
  margin-right: 38px;
  border-radius: 9px;
  background: #d9d1c3;
}

.report-mini-title {
  margin-top: 23px;
  color: #2d4b46;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.4;
}

.report-mini-meta {
  margin-top: 7px;
  color: #9c9a8e;
  font-size: 9px;
}

.report-mini-map {
  position: relative;
  height: 174px;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 13px;
  background: linear-gradient(145deg, #f1f9f4, #f8f3e9);
}

.mini-body {
  position: absolute;
  top: 33px;
  left: 50%;
  width: 49px;
  height: 113px;
  transform: translateX(-50%);
  border: 1px solid #c7e2d9;
  border-radius: 22px 22px 14px 14px;
  background: linear-gradient(145deg, #eaf7f1, #cfeae0);
}

.mini-body::before {
  content: "";
  position: absolute;
  top: -24px;
  left: 50%;
  width: 28px;
  height: 31px;
  transform: translateX(-50%);
  border: 1px solid #c7e2d9;
  border-radius: 50%;
  background: #dff2e9;
}

.report-mini-map i {
  position: absolute;
  z-index: 2;
  width: 9px;
  height: 9px;
  border: 2px solid #fffefb;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
}

.report-mini-map i.good { background: #2aa58e; }
.report-mini-map i.watch { background: #d3a04b; }
.report-mini-map i.check { background: #d47861; }
.report-mini-map i:nth-of-type(1) { top: 37px; left: calc(50% + 3px); }
.report-mini-map i:nth-of-type(2) { top: 82px; left: calc(50% + 13px); }
.report-mini-map i:nth-of-type(3) { top: 102px; left: calc(50% + 2px); }
.report-mini-map i:nth-of-type(4) { top: 139px; left: calc(50% - 10px); }

.report-mini-lines {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 18px;
}

.report-mini-lines i {
  display: block;
  height: 5px;
  border-radius: 4px;
  background: #eae4d8;
}

.report-mini-lines i:nth-child(1) { width: 88%; }
.report-mini-lines i:nth-child(2) { width: 69%; }
.report-mini-lines i:nth-child(3) { width: 78%; }

.report-mini-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 17px;
  padding-top: 9px;
  color: #a19c8c;
  border-top: 1px solid #f0eadf;
  font-size: 8px;
}

.report-teaser-copy h2 {
  margin-top: 15px;
  color: var(--ink);
  font-size: clamp(32px, 3.1vw, 44px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.3;
}

.report-teaser-copy > p {
  max-width: 530px;
  margin-top: 14px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.report-features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 17px;
  margin-top: 19px;
  color: var(--ink-2);
  font-size: 11.5px;
}

.report-features span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.report-features svg {
  color: var(--teal);
}

.report-teaser-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 25px;
}

/* ---------- footer ---------- */

.page-footer {
  display: flex;
  align-items: flex-start;
  gap: 35px;
  margin-top: 72px;
  padding-top: 23px;
  border-top: 1px solid #dfd8cb;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.footer-brand .brand-mark {
  width: 33px;
  height: 33px;
  border-radius: 10px;
}

.footer-brand .brand-mark svg {
  width: 26px;
  height: 26px;
}

.footer-brand > span {
  display: flex;
  flex-direction: column;
}

.footer-brand b {
  font-size: 14px;
  letter-spacing: 0.05em;
}

.footer-brand small {
  color: var(--muted-2);
  font-size: 9.5px;
}

.footer-note {
  flex: 1;
  color: var(--muted-2);
  font-size: 10px;
  line-height: 1.8;
}

.footer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  color: var(--muted-2);
  font-size: 10px;
}

.footer-actions span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ---------- toast ---------- */

.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 32px);
  padding: 11px 17px;
  transform: translateX(-50%);
  color: #f8fbf6;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  background: rgba(18, 63, 59, 0.95);
  box-shadow: 0 13px 30px rgba(12, 44, 40, 0.22);
  font-size: 12px;
  animation: toastIn 0.24s ease both;
  backdrop-filter: blur(12px);
}

.toast svg {
  color: #99e0cc;
}

/* ---------- detail sheet ---------- */

.sheet-layer {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.sheet-scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 35, 32, 0.51);
  backdrop-filter: blur(6px);
  cursor: default;
  animation: fadeIn 0.22s ease both;
}

.detail-sheet {
  position: relative;
  width: min(1130px, calc(100vw - 44px));
  max-height: calc(100vh - 38px);
  overflow-y: auto;
  overscroll-behavior: contain;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 29px 29px 0 0;
  background: var(--paper);
  box-shadow: 0 -22px 80px rgba(8, 38, 33, 0.26);
  animation: sheetUp 0.3s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.sheet-accent {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
}

.sheet-accent.good { background: linear-gradient(90deg, #45bca3, #a7e3d3); }
.sheet-accent.watch { background: linear-gradient(90deg, #d3a04b, #eccb8d); }
.sheet-accent.check { background: linear-gradient(90deg, #d47861, #eab0a1); }

.sheet-grab {
  position: absolute;
  top: 10px;
  left: 50%;
  width: 39px;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 99px;
  background: #d8d1c4;
}

.sheet-header {
  position: relative;
  padding: 28px 48px 20px;
}

.sheet-topline {
  display: flex;
  align-items: center;
  gap: 13px;
  padding-right: 48px;
}

.sheet-index {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 11px;
}

.sheet-index > span {
  color: var(--ink-2);
  font-family: var(--font-number);
  font-size: 17px;
  font-weight: 600;
}

.sheet-index > em {
  color: var(--muted-2);
  font-family: var(--font-number);
  font-size: 10px;
  font-style: normal;
}

.sheet-index > i {
  width: 1px;
  height: 12px;
  margin: 0 4px;
  background: var(--line);
}

.sheet-index > b {
  color: var(--muted);
  font-weight: 500;
}

.sheet-close {
  position: absolute;
  top: 23px;
  right: 26px;
  display: grid;
  width: 39px;
  height: 39px;
  place-items: center;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.sheet-close:hover {
  color: var(--ink);
  background: #f3efe6;
  transform: rotate(90deg);
}

.sheet-header h2 {
  max-width: 770px;
  margin-top: 17px;
  color: var(--ink);
  font-size: clamp(31px, 3.2vw, 42px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.3;
}

.sheet-header > p {
  max-width: 770px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.sheet-method {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 15px;
  padding: 5px 9px;
  color: var(--muted);
  border-radius: 99px;
  background: #f4f0e7;
  font-size: 10.5px;
}

.sheet-content {
  display: grid;
  grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.06fr);
  gap: 33px;
  padding: 5px 48px 27px;
}

.visual-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 10.5px;
}

.visual-label > span {
  color: var(--ink-2);
  font-weight: 600;
}

.visual-label > em {
  color: var(--muted-2);
  font-style: normal;
}

.visual-frame {
  position: relative;
  overflow: hidden;
  min-height: 330px;
  padding: 17px;
  border: 1px solid #e6e1d5;
  border-radius: 23px;
  background:
    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 36%),
    #fbf9f3;
}

.visual-frame.good { --accent: #2aa58e; }
.visual-frame.watch { --accent: #d3a04b; }
.visual-frame.check { --accent: #d47861; }

.visual-footnote {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin-top: 8px;
  color: var(--muted-2);
  font-size: 10px;
  line-height: 1.6;
}

.visual-footnote svg {
  flex: 0 0 auto;
  margin-top: 1px;
}

.sheet-copy {
  display: flex;
  flex-direction: column;
  gap: 17px;
  min-width: 0;
}

.why-block {
  padding-top: 2px;
}

.why-block h3 {
  color: var(--ink-2);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.why-block ul {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 11px;
}

.why-block li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.7;
}

.why-block li > i {
  width: 6px;
  height: 6px;
  flex: 0 0 auto;
  margin-top: 7px;
  border-radius: 50%;
}

.why-block li > i.good { background: #2aa58e; }
.why-block li > i.watch { background: #d3a04b; }
.why-block li > i.check { background: #d47861; }

.meaning-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.meaning-card {
  padding: 12px 13px;
  border: 1px solid #dcebe2;
  border-radius: 15px;
  background: #f6fbf7;
}

.meaning-card.is-muted {
  border-color: #ebe4d8;
  background: #fbf8f1;
}

.meaning-card > span {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--teal);
  font-size: 10.5px;
  font-weight: 600;
}

.meaning-card.is-muted > span {
  color: #9b8d78;
}

.meaning-card p {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.next-step {
  display: flex;
  gap: 11px;
  padding: 13px 14px;
  border-radius: 16px;
}

.next-step.good { background: #e8f6f1; }
.next-step.watch { background: #fbf1df; }
.next-step.check { background: #fbeae4; }

.next-step-icon {
  display: grid;
  width: 31px;
  height: 31px;
  flex: 0 0 auto;
  place-items: center;
  color: var(--ink-2);
  border-radius: 50%;
  background: rgba(255, 253, 249, 0.68);
}

.next-step > div:last-child > span {
  color: var(--ink-2);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.05em;
}

.next-step p {
  margin-top: 2px;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.65;
}

.data-details {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffefb;
}

.data-details summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 13px;
  color: var(--ink-2);
  border-radius: 14px;
  cursor: pointer;
  list-style: none;
  font-size: 11.5px;
  font-weight: 550;
}

.data-details summary::-webkit-details-marker {
  display: none;
}

.data-details summary > span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.data-details summary em {
  color: var(--muted-2);
  font-style: normal;
  font-weight: 400;
}

.detail-chevron {
  color: var(--muted-2);
  transition: transform 0.2s ease;
}

.data-details[open] .detail-chevron {
  transform: rotate(180deg);
}

.detail-table-wrap {
  padding: 0 13px 12px;
  overflow-x: auto;
}

.detail-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 10.5px;
}

.detail-table th {
  padding: 8px 6px;
  color: var(--muted-2);
  border-bottom: 1px solid var(--line);
  font-weight: 500;
  text-align: left;
  white-space: nowrap;
}

.detail-table td {
  padding: 8px 6px;
  color: var(--muted);
  border-bottom: 1px solid #f1ece2;
  vertical-align: top;
}

.detail-table tr:last-child td {
  border-bottom: 0;
}

.detail-table td:first-child {
  color: var(--ink-2);
}

.detail-table td:first-child span {
  display: block;
}

.detail-table td:first-child small {
  display: block;
  max-width: 210px;
  margin-top: 1px;
  color: var(--muted-2);
  font-size: 9px;
  line-height: 1.4;
}

.detail-table td b {
  color: var(--ink);
  font-family: var(--font-number);
  font-size: 12px;
  font-weight: 600;
}

.detail-table td > small {
  margin-left: 2px;
  color: var(--muted-2);
  font-size: 9px;
}

.row-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.row-status i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.row-status.good { color: #1b8a78; }
.row-status.good i { background: #2aa58e; }
.row-status.watch { color: #9a691f; }
.row-status.watch i { background: #d3a04b; }
.row-status.check { color: #ad5540; }
.row-status.check i { background: #d47861; }
.row-status.none { color: var(--muted-2); }
.row-status.none i { background: #c8c2b7; }

.table-note {
  margin-top: 8px;
  color: var(--muted-2);
  font-size: 9px;
  line-height: 1.6;
}

.sheet-ai-note {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  color: var(--muted-2);
  font-size: 9.5px;
  line-height: 1.6;
}

.sheet-ai-note svg {
  flex: 0 0 auto;
  margin-top: 1px;
}

.sheet-footer {
  position: sticky;
  bottom: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 29px 14px;
  border-top: 1px solid var(--line);
  background: rgba(255, 253, 249, 0.94);
  backdrop-filter: blur(12px);
}

.sheet-nav-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 158px;
  padding: 7px 11px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 12px;
  text-align: left;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.sheet-nav-btn:hover:not(:disabled) {
  color: var(--ink);
  border-color: #c8beae;
  background: #f8f4eb;
}

.sheet-nav-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.sheet-nav-btn > span {
  display: flex;
  flex-direction: column;
  line-height: 1.35;
}

.sheet-nav-btn small {
  color: var(--muted-2);
  font-size: 9px;
}

.sheet-nav-btn b {
  color: var(--ink-2);
  font-size: 10.5px;
  font-weight: 550;
}

.sheet-nav-btn.is-next {
  justify-content: flex-end;
  text-align: right;
}

.sheet-progress {
  display: flex;
  align-items: center;
  gap: 5px;
}

.sheet-progress span {
  display: block;
  width: 16px;
  height: 3px;
  border-radius: 99px;
  background: #e4ded2;
  transition: width 0.2s ease, background 0.2s ease;
}

.sheet-progress span.done {
  background: #a5c9bf;
}

.sheet-progress span.active {
  width: 28px;
}

.sheet-progress span.active.good { background: #2aa58e; }
.sheet-progress span.active.watch { background: #d3a04b; }
.sheet-progress span.active.check { background: #d47861; }

/* ---------- foot chart ---------- */

.foot-chart {
  width: 100%;
}

.foot-chart-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 2px;
}

.chart-phase-labels {
  display: flex;
  width: calc(100% - 92px);
  color: var(--muted-2);
  font-size: 8.5px;
  line-height: 1.4;
}

.chart-phase-labels span {
  display: block;
  text-align: center;
}

.chart-phase-labels .phase-occlusion {
  color: #ad8036;
}

.chart-unit {
  color: var(--muted-2);
  font-size: 8.5px;
}

.chart-svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart-grid {
  stroke: #e9e3d8;
  stroke-width: 1;
  stroke-dasharray: 3 5;
}

.chart-axis {
  fill: #9aa49e;
  font-family: var(--font-number);
  font-size: 9px;
}

.chart-baseline {
  stroke: #a8beb5;
  stroke-width: 1;
  stroke-dasharray: 4 5;
}

.chart-note {
  fill: #9aa8a2;
  font-size: 8px;
}

.foot-line {
  fill: none;
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.foot-line.left.good { stroke: #1e9984; }
.foot-line.left.watch { stroke: #c18c37; }
.foot-line.left.check { stroke: #c7644f; }
.foot-line.right {
  stroke: #93b9c9;
  stroke-width: 1.8;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.release-line {
  stroke: #c8bca8;
  stroke-width: 1;
  stroke-dasharray: 3 4;
}

.release-label {
  fill: #a39a8b;
  font-size: 8px;
}

.chart-dot {
  stroke: #fffdf9;
  stroke-width: 2;
}

.chart-dot.good { fill: #1e9984; }
.chart-dot.watch { fill: #c18c37; }
.chart-dot.check { fill: #c7644f; }

.recovery-dot {
  stroke: #fffdf9;
  stroke-width: 2;
}

.recovery-ring {
  fill: none;
  stroke-width: 1;
  opacity: 0.45;
}

.recovery-dot.good, .recovery-ring.good { fill: #1e9984; stroke: #1e9984; }
.recovery-dot.watch, .recovery-ring.watch { fill: #c18c37; stroke: #c18c37; }
.recovery-dot.check, .recovery-ring.check { fill: #c7644f; stroke: #c7644f; }

.recovery-ring {
  fill: none;
}

.chart-bubble {
  fill: #fffdf9;
  stroke: #e4ddd0;
  stroke-width: 1;
}

.chart-bubble + text {
  font-family: var(--font-sans);
}

.chart-bubble ~ text.bubble-title {
  fill: #9b978b;
  font-size: 7.5px;
}

.chart-bubble ~ text.bubble-value {
  fill: #2d4d48;
  font-family: var(--font-number);
  font-size: 11px;
  font-weight: 600;
}

.chart-legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 1px;
  color: var(--muted);
  font-size: 9px;
}

.chart-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.line-key {
  display: inline-block;
  width: 15px;
  height: 2px;
  border-radius: 9px;
}

.line-key.left { background: #1e9984; }
.line-key.left.watch { background: #c18c37; }
.line-key.left.check { background: #c7644f; }
.line-key.right {
  height: 0;
  border-top: 2px dashed #93b9c9;
  background: transparent;
}

.chart-hint-line {
  margin-left: auto;
  color: var(--muted-2);
}

/* ---------- brain visual ---------- */

.brain-visual {
  width: 100%;
}

.brain-svg {
  width: 100%;
  height: auto;
}

.brain-side-label {
  fill: #67817a;
  font-size: 11px;
}

.brain-value-label {
  fill: #294d46;
  font-family: var(--font-number);
  font-size: 23px;
  font-weight: 600;
}

.brain-balance {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 9px;
  border: 1px solid #e7e2d6;
  border-radius: 12px;
  background: rgba(255, 253, 249, 0.75);
  color: var(--muted);
  font-size: 8.5px;
}

.brain-balance strong {
  color: var(--ink-2);
  font-family: var(--font-number);
  font-size: 13px;
  font-weight: 600;
}

.brain-balance .balance-divider {
  padding: 0 7px;
  color: var(--muted-2);
  border-right: 1px solid #e5dfd2;
  border-left: 1px solid #e5dfd2;
}

.balance-mark {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-left: 4px;
  border-radius: 50%;
  background: currentColor;
}

.balance-mark.left { color: #2aa58e; }
.balance-mark.right { color: #8bb8c7; }

.brain-verdict {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 7px;
  color: var(--muted);
  font-size: 9.5px;
  text-align: center;
}

.verdict-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent, #2aa58e);
}

.brain-visual.good .verdict-dot { background: #2aa58e; }
.brain-visual.watch .verdict-dot { background: #d3a04b; }
.brain-visual.check .verdict-dot { background: #d47861; }

/* ---------- blood visual ---------- */

.blood-visual {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.capillary-scene {
  padding: 12px 13px 3px;
  border: 1px solid #ecdccf;
  border-radius: 16px;
  background:
    radial-gradient(circle at 90% 0%, rgba(247, 214, 190, 0.55), transparent 35%),
    #fff8f1;
}

.capillary-scene.watch { border-color: #ebd7b7; }
.capillary-scene.check { border-color: #ebc5b8; }

.capillary-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: #8e6d5e;
  font-size: 9px;
}

.capillary-label > span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.capillary-label > em {
  color: #b09a8d;
  font-size: 8px;
  font-style: normal;
}

.capillary-svg {
  width: 100%;
  height: auto;
}

.capillary-note {
  fill: #b49c8c;
  font-size: 8px;
}

.bio-bars {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.bio-bar {
  padding: 9px 11px;
  border: 1px solid #eae4d8;
  border-radius: 12px;
  background: rgba(255, 253, 249, 0.8);
}

.bio-bar.good { --accent: #1f9b84; }
.bio-bar.watch { --accent: #c49139; }
.bio-bar.check { --accent: #c7644f; }

.bio-bar-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  color: var(--ink-2);
  font-size: 9.5px;
}

.bio-value {
  color: var(--accent);
  font-family: var(--font-number);
  font-size: 16px;
  font-weight: 600;
}

.bio-value small {
  margin-left: 3px;
  color: var(--muted-2);
  font-family: var(--font-sans);
  font-size: 8px;
  font-weight: 400;
}

.bio-track {
  position: relative;
  height: 7px;
  margin-top: 5px;
  border-radius: 99px;
  background: #f0ece3;
}

.bio-range {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 99px;
  background: rgba(42, 165, 142, 0.22);
}

.bio-marker {
  position: absolute;
  top: 50%;
  width: 11px;
  height: 11px;
  transform: translate(-50%, -50%);
  border: 2px solid #fffdf9;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 1px 4px rgba(41, 67, 60, 0.18);
}

.bio-bar-foot {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-top: 3px;
  color: var(--muted-2);
  font-size: 7.5px;
}

/* ---------- heart visual ---------- */

.heart-visual {
  width: 100%;
}

.bp-readout {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 12px;
  padding: 2px 0 0;
}

.bp-readout > div:not(.bp-slash) {
  display: flex;
  flex-direction: column;
}

.bp-readout > div:first-child {
  align-items: flex-end;
}

.bp-readout span {
  color: var(--muted);
  font-size: 9px;
}

.bp-readout span small {
  color: var(--muted-2);
  font-size: 8px;
}

.bp-readout strong {
  color: #b85844;
  font-family: var(--font-number);
  font-size: clamp(44px, 5vw, 58px);
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1.08;
}

.bp-readout strong em {
  margin-left: 3px;
  color: #b59b90;
  font-family: var(--font-sans);
  font-size: 8px;
  font-style: normal;
  font-weight: 400;
}

.bp-slash {
  padding-bottom: 8px;
  color: #c8b8ac;
  font-family: var(--font-number);
  font-size: 30px;
  font-weight: 300;
}

.bp-chart {
  margin-top: 2px;
}

.bp-chart .chart-axis {
  font-size: 8px;
}

.bp-line {
  fill: none;
  stroke: #cd6b54;
  stroke-width: 2.5;
  stroke-linecap: round;
}

.bp-dot {
  fill: #cd6b54;
  stroke: #fffdf9;
  stroke-width: 2;
}

.bp-scale {
  max-width: 380px;
  margin: 0 auto;
}

.bp-scale-labels {
  display: flex;
  color: var(--muted-2);
  font-size: 8px;
}

.bp-scale-labels span {
  flex: 4;
}

.bp-scale-labels span:nth-child(2) {
  flex: 2;
  text-align: center;
}

.bp-scale-labels span:nth-child(3) {
  flex: 4;
  text-align: right;
}

.bp-scale-track {
  position: relative;
  display: flex;
  height: 8px;
  margin-top: 5px;
  overflow: visible;
  border-radius: 99px;
  background: #f1ece2;
}

.bp-zone.ideal {
  width: 40%;
  border-radius: 99px 0 0 99px;
  background: #82cdb9;
}

.bp-zone.high {
  width: 20%;
  background: #e3bd76;
}

.bp-zone.elevated {
  width: 40%;
  border-radius: 0 99px 99px 0;
  background: #df9a85;
}

.bp-marker {
  position: absolute;
  top: -5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
  color: #a9523f;
  font-size: 7.5px;
  white-space: nowrap;
}

.bp-marker i {
  display: block;
  width: 9px;
  height: 9px;
  margin-bottom: 2px;
  border: 2px solid #fffdf9;
  border-radius: 50%;
  background: #b85844;
  box-shadow: 0 1px 3px rgba(95, 30, 15, 0.2);
}

.bp-marker {
  padding-top: 12px;
}

.vital-chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  margin-top: 9px;
}

.vital-chips span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 7px;
  color: var(--muted);
  border: 1px solid #e9e3d7;
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.8);
  font-size: 8px;
}

.vital-chips b {
  color: var(--ink-2);
  font-family: var(--font-number);
  font-size: 10px;
  font-weight: 600;
}

/* ---------- report view ---------- */

.report-view {
  min-height: 100vh;
  padding-bottom: 54px;
  background: #e9e5dc;
}

.report-toolbar {
  position: sticky;
  top: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 68px;
  padding: 10px 36px;
  border-bottom: 1px solid #d8d1c4;
  background: rgba(247, 245, 239, 0.93);
  backdrop-filter: blur(18px);
}

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12.5px;
  transition: color 0.2s ease;
}

.back-button:hover {
  color: var(--ink);
}

.report-toolbar-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.35;
}

.report-toolbar-title span {
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 600;
}

.report-toolbar-title small {
  color: var(--muted-2);
  font-size: 9.5px;
}

.report-canvas {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 32px 18px 0;
}

.report-page {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 210mm;
  min-height: 297mm;
  padding: 16mm 15.5mm 13mm;
  color: #2b3d3a;
  background: #fffefb;
  box-shadow: 0 16px 50px rgba(43, 47, 38, 0.16);
  font-size: 10.5px;
  line-height: 1.6;
}

.report-brand-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid #e4ddd0;
}

.report-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.report-brand-mark {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  color: #a6e2d4;
  border-radius: 9px;
  background: #123f3b;
}

.report-brand-mark svg {
  width: 26px;
  height: 26px;
}

.report-brand > div {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}

.report-brand b {
  color: #183c39;
  font-size: 16px;
  letter-spacing: 0.08em;
}

.report-brand small {
  color: #8b968e;
  font-size: 7px;
  letter-spacing: 0.09em;
}

.report-head-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.45;
}

.report-head-meta b {
  color: #41524d;
  font-size: 9px;
  font-weight: 600;
}

.report-head-meta span {
  color: #929a92;
  font-size: 8px;
}

.report-title-block {
  padding: 20px 0 16px;
}

.report-kicker {
  color: #1d8c7a;
  font-size: 6.8px;
  font-weight: 600;
  letter-spacing: 0.16em;
}

.report-title-block h1 {
  margin-top: 7px;
  color: #173c38;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.3;
}

.report-title-block > p {
  margin-top: 3px;
  color: #75857f;
  font-size: 11px;
}

.report-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 20px;
  margin-top: 13px;
  padding-top: 10px;
  border-top: 1px solid #eee9df;
  color: #95a098;
  font-size: 8px;
}

.report-meta-grid b {
  margin-left: 4px;
  color: #4c5e58;
  font-weight: 500;
}

.report-summary {
  display: grid;
  grid-template-columns: 168px 1fr;
  gap: 16px;
  padding: 13px 16px;
  border: 1px solid #e2ded1;
  border-radius: 10px;
  background: #faf7ef;
}

.report-summary.good { border-color: #cfe6de; background: #f2faf6; }
.report-summary.watch { border-color: #eadbbd; background: #fcf7eb; }
.report-summary.check { border-color: #ecd3ca; background: #fcf3ef; }

.report-summary-status {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding-right: 14px;
  border-right: 1px solid rgba(130, 120, 100, 0.18);
}

.report-summary-status > span:first-child {
  color: #8e988f;
  font-size: 7.5px;
}

.report-summary-status > strong {
  color: #213f39;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}

.report-summary-status .status-pill {
  margin-top: 1px;
  padding: 3px 7px;
  font-size: 7.5px;
}

.report-summary-copy p {
  color: #334d47;
  font-size: 12px;
  font-weight: 600;
}

.report-summary-copy small {
  display: block;
  margin-top: 5px;
  color: #7d8b84;
  font-size: 8.5px;
  line-height: 1.7;
}

.report-section {
  margin-top: 17px;
}

.report-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid #e9e3d6;
}

.report-section-head h2 {
  color: #24453f;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.report-section-head span {
  color: #9aa39b;
  font-size: 7.5px;
}

.report-map-row {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 15px;
  align-items: center;
  padding-top: 8px;
}

.report-map {
  padding: 4px 0 0;
  text-align: center;
}

.report-map svg {
  width: 148px;
  height: auto;
  margin: 0 auto;
}

.report-map-legend {
  display: flex;
  justify-content: center;
  gap: 9px;
  margin-top: -2px;
  color: #8b968e;
  font-size: 6.5px;
}

.report-map-legend span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.report-map-legend i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.report-map-legend i.good { background: #2aa58e; }
.report-map-legend i.watch { background: #d3a04b; }
.report-map-legend i.check { background: #d47861; }

.report-area-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.report-area-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border: 1px solid #ece6db;
  border-radius: 8px;
  background: #fffefb;
}

.report-area-icon {
  display: grid;
  width: 25px;
  height: 25px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 7px;
}

.report-area-row.good .report-area-icon { color: #1c8d79; background: #e9f6f1; }
.report-area-row.watch .report-area-icon { color: #a47327; background: #fbf0dc; }
.report-area-row.check .report-area-icon { color: #b15742; background: #fbe9e2; }

.report-area-row > div {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.35;
}

.report-area-row b {
  color: #41554f;
  font-size: 8.5px;
  font-weight: 600;
}

.report-area-row small {
  color: #96a29b;
  font-size: 7px;
}

.report-area-row em {
  margin-left: auto;
  font-style: normal;
  font-size: 7.5px;
  font-weight: 500;
  white-space: nowrap;
}

.report-area-row.good em { color: #1a8a76; }
.report-area-row.watch em { color: #a06e23; }
.report-area-row.check em { color: #ae543f; }

.report-good-news {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 14px;
  padding: 10px 13px;
  border: 1px solid #d8e9e1;
  border-radius: 9px;
  background: #f4faf6;
}

.report-good-news > svg {
  flex: 0 0 auto;
  margin-top: 2px;
  color: #238e7b;
}

.report-good-news > div {
  display: flex;
  flex-direction: column;
}

.report-good-news b {
  color: #1e7e6c;
  font-size: 8px;
  font-weight: 600;
}

.report-good-news span {
  margin-top: 2px;
  color: #5d746c;
  font-size: 8.5px;
}

.report-section-areas {
  margin-top: 10px;
}

.report-section-areas .report-area-grid {
  padding-top: 7px;
}

.report-quick-wrap {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid #ece6da;
}

.report-quick-label {
  color: #86928a;
  font-size: 7px;
  letter-spacing: 0.04em;
}

.report-quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 6px;
}

.report-quick-cell {
  position: relative;
  padding: 7px 8px;
  border: 1px solid #ece6da;
  border-radius: 7px;
  background: #fcfaf5;
}

.report-quick-cell span {
  display: block;
  color: #8d9890;
  font-size: 6.5px;
}

.report-quick-cell b {
  display: block;
  margin-top: 1px;
  color: #2c4a43;
  font-family: var(--font-number);
  font-size: 9.5px;
  font-weight: 600;
}

.report-quick-cell i {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.report-quick-cell i.good { background: #2aa58e; }
.report-quick-cell i.watch { background: #d3a04b; }
.report-quick-cell i.check { background: #d47861; }

.report-question-section {
  margin-top: 15px;
}

.report-questions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  padding-top: 8px;
}

.report-questions p {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 8px 9px;
  color: #6c7d75;
  border: 1px solid #eae4d8;
  border-radius: 7px;
  background: #fffefb;
  font-size: 7.2px;
  line-height: 1.6;
}

.report-questions p > span {
  display: grid;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  place-items: center;
  color: #1b8a77;
  border-radius: 50%;
  background: #e9f6f1;
  font-family: var(--font-number);
  font-size: 8px;
  font-weight: 600;
}

.report-followup {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 13px;
  padding: 10px 13px;
  border: 1px solid #e4ddcf;
  border-radius: 8px;
  background: #fbf8f0;
}

.report-followup.good { border-color: #d5e9e1; background: #f3faf6; }
.report-followup.watch { border-color: #eaddc3; background: #fcf7ec; }
.report-followup.check { border-color: #ecd4ca; background: #fcf4f0; }

.report-followup-time {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  min-width: 73px;
  padding-right: 13px;
  border-right: 1px solid rgba(126, 116, 95, 0.18);
}

.report-followup-time span {
  color: #9a9f95;
  font-size: 6.8px;
}

.report-followup-time b {
  color: #2e4d45;
  font-size: 12px;
  font-weight: 600;
}

.report-followup p {
  color: #78857d;
  font-size: 8px;
  line-height: 1.65;
}

.report-method-section {
  margin-top: 14px;
}

.report-methods {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  padding-top: 8px;
}

.report-method {
  display: flex;
  flex-direction: column;
  padding: 8px 9px;
  border: 1px solid #ebe5d9;
  border-radius: 7px;
  background: #fffefb;
}

.report-method-icon {
  display: grid;
  width: 22px;
  height: 22px;
  margin-bottom: 4px;
  place-items: center;
  color: #1b8a77;
  border-radius: 6px;
  background: #e9f6f1;
}

.report-method-icon.watch { color: #a47327; background: #fbf0dc; }
.report-method-icon.check { color: #b15742; background: #fbe9e2; }

.report-method b {
  color: #435851;
  font-size: 7.6px;
  font-weight: 600;
}

.report-method small {
  margin-top: 1px;
  color: #9aa39b;
  font-size: 6.4px;
  line-height: 1.45;
}

.report-habit-section {
  margin-top: 13px;
}

.report-habit-table {
  margin-top: 7px;
  padding: 5px 9px;
  border: 1px solid #eae4d8;
  border-radius: 7px;
  background: #fffefb;
}

.report-habit-row {
  display: grid;
  grid-template-columns: 1.8fr repeat(7, 1fr);
  align-items: center;
  gap: 6px;
  min-height: 20px;
  color: #6d7e76;
  border-bottom: 1px solid #f1ece2;
  font-size: 7.2px;
}

.report-habit-row:last-child {
  border-bottom: 0;
}

.report-habit-row > span {
  padding-left: 2px;
}

.report-habit-row > i {
  display: grid;
  width: 14px;
  height: 14px;
  justify-self: center;
  place-items: center;
  color: #9ca69e;
  border: 1px solid #dcd5c7;
  border-radius: 50%;
  font-family: var(--font-number);
  font-size: 6.2px;
  font-style: normal;
}

.report-habit-row.is-head {
  color: #9da69e;
  border-bottom-color: #e9e3d7;
  font-size: 6.4px;
}

.report-habit-row.is-head > i {
  border: 0;
}

.report-dictionary {
  margin-top: 14px;
}

.report-dictionary-page-one {
  margin-top: 4px;
}

.report-dictionary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  padding-top: 6px;
}

.report-dictionary-grid > div {
  padding: 6px 8px;
  border-radius: 7px;
  background: #f8f5ed;
}

.report-dictionary-grid b {
  color: #4c625b;
  font-size: 7.8px;
  font-weight: 600;
}

.report-dictionary-grid p {
  margin-top: 2px;
  color: #8b968e;
  font-size: 7px;
  line-height: 1.5;
}

.report-actions p {
  font-size: 7.6px;
}

.report-action-time {
  font-size: 8px;
}

.report-questions p {
  font-size: 7.8px;
}

.report-data-cell > span {
  font-size: 7.1px;
}

.report-data-cell > b {
  font-size: 10.5px;
}

.report-method small {
  font-size: 6.8px;
}

.report-habit-row {
  font-size: 7.5px;
}

.report-followup p {
  font-size: 8.2px;
}

.report-detail-card > p {
  font-size: 8px;
}

.report-page-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: auto;
  padding-top: 10px;
  color: #a3aaa2;
  border-top: 1px solid #ece6da;
  font-size: 7px;
}

.report-page-header {
  display: flex;
  justify-content: space-between;
  padding-bottom: 9px;
  color: #98a29a;
  border-bottom: 1px solid #e4ddd0;
  font-size: 7px;
}

.report-page-two .report-section {
  margin-top: 14px;
}

.report-area-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding-top: 8px;
}

.report-detail-card {
  padding: 9px 11px;
  border: 1px solid #ebe5d9;
  border-left: 2px solid var(--accent);
  border-radius: 8px;
  background: #fffefb;
}

.report-detail-card.good { --accent: #2aa58e; }
.report-detail-card.watch { --accent: #d3a04b; }
.report-detail-card.check { --accent: #d47861; }

.report-detail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.report-detail-head > span {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #50645d;
  font-size: 8px;
  font-weight: 600;
}

.report-detail-head > span svg {
  color: var(--accent);
}

.report-detail-head em {
  color: var(--accent);
  font-size: 6.8px;
  font-style: normal;
}

.report-detail-card > b {
  display: block;
  margin-top: 4px;
  color: #2b4942;
  font-size: 10px;
  font-weight: 600;
}

.report-detail-card > p {
  margin-top: 3px;
  color: #7d8b84;
  font-size: 7.5px;
  line-height: 1.65;
}

.report-data-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding-top: 8px;
}

.report-data-cell {
  position: relative;
  padding: 7px 8px;
  overflow: hidden;
  border: 1px solid #ece6da;
  border-radius: 7px;
  background: #fcfaf5;
}

.report-data-cell > span {
  display: block;
  color: #8d9890;
  font-size: 6.8px;
}

.report-data-cell > b {
  display: block;
  margin-top: 2px;
  color: #2c4a43;
  font-family: var(--font-number);
  font-size: 10px;
  font-weight: 600;
}

.report-data-cell > small {
  display: block;
  color: #9da69e;
  font-size: 6.2px;
}

.report-data-cell > i {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.report-data-cell > i.good { background: #2aa58e; }
.report-data-cell > i.watch { background: #d3a04b; }
.report-data-cell > i.check { background: #d47861; }

.report-action-section {
  margin-top: 15px;
}

.report-actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1.1fr;
  gap: 8px;
  padding-top: 8px;
}

.report-actions > div {
  padding: 8px 9px;
  border-radius: 8px;
  background: #f8f5ed;
}

.report-action-time {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #1f7f6e;
  font-size: 7.5px;
  font-weight: 600;
}

.report-actions p {
  position: relative;
  margin-top: 5px;
  padding-left: 8px;
  color: #6c7d75;
  font-size: 7.2px;
  line-height: 1.55;
}

.report-actions p::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 0;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #99b4aa;
}

.report-doctor-note {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-top: 14px;
  padding: 9px 12px;
  border-left: 2px solid #d1a15c;
  border-radius: 0 7px 7px 0;
  background: #fcf7ec;
}

.report-doctor-note > span {
  flex: 0 0 auto;
  color: #9d6c25;
  font-size: 7.5px;
  font-weight: 600;
}

.report-doctor-note p {
  color: #7d7260;
  font-size: 8px;
  line-height: 1.65;
}

.report-sign {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 22px;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid #ebe5d9;
}

.report-sign > div:first-child {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.report-sign span {
  color: #9ba49c;
  font-size: 6.8px;
}

.report-sign b {
  color: #354e48;
  font-size: 10px;
  font-weight: 600;
}

.report-sign small {
  color: #9ba49c;
  font-size: 6.5px;
}

.report-sign-mark {
  color: #33534b;
  font-family: "KaiTi", "STKaiti", serif;
  font-size: 22px;
  letter-spacing: 0.1em;
  transform: rotate(-4deg);
}

.report-date-stamp {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.report-disclaimer {
  display: block;
  margin-top: 13px;
  line-height: 1.65;
}

.report-disclaimer p {
  max-width: 560px;
  color: #a0a79f;
  font-size: 6.6px;
}

.report-disclaimer span {
  display: block;
  margin-top: 3px;
  text-align: right;
}

/* ---------- animations ---------- */

@keyframes menuIn {
  from { opacity: 0; transform: translateY(-5px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes sheetUp {
  from { opacity: 0; transform: translateY(36px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pinPulse {
  0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.65); }
  70% { opacity: 0; transform: translate(-50%, -50%) scale(1.65); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.65); }
}

@keyframes auraBreathe {
  0%, 100% { opacity: 0.5; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.05); }
}
